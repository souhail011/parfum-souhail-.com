</footer>

<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Messhop</title>

<style>
body{margin:0;font-family:Arial;background:#f4f6f9}

/* HEADER */
header{
background:#00a2ff;
color:white;
padding:12px;
text-align:center;
font-size:20px;
font-weight:bold;
position:sticky;
top:0;
}

/* GRID */
.grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:10px;
padding:10px;
}

/* CARD */
.card{
background:white;
border-radius:12px;
overflow:hidden;
cursor:pointer;
}

.card img{
width:100%;
height:130px;
object-fit:cover;
}

.card p{margin:5px;font-size:13px}

/* PAGE */
.page{
display:none;
padding:15px;
}

.page img{
width:100%;
border-radius:12px;
}

.price{
font-size:22px;
color:#0099ff;
font-weight:bold;
margin:10px 0;
}

/* SIZE BUTTONS */
.sizes button{
margin:5px;
padding:8px 12px;
border:none;
border-radius:8px;
background:#eee;
cursor:pointer;
}

.sizes button.active{
background:#00a2ff;
color:white;
}

/* BTN */
.btn{
display:block;
background:#ff6b00;
color:white;
text-align:center;
padding:12px;
border-radius:10px;
text-decoration:none;
margin-top:10px;
border:none;
cursor:pointer;
}

/* BACK */
.back{
background:black;
color:white;
padding:8px 12px;
border:none;
border-radius:8px;
margin-bottom:10px;
cursor:pointer;
}

/* RELATED */
.relatedTitle{
margin-top:25px;
font-weight:bold;
}

.smallGrid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:10px;
margin-top:10px;
}

.small{
background:white;
border-radius:10px;
overflow:hidden;
cursor:pointer;
}

.small img{
width:100%;
height:110px;
object-fit:cover;
}

/* ANIMATION */
.show{display:block;animation:fade .25s ease}

@keyframes fade{
from{opacity:0;transform:translateY(10px)}
to{opacity:1;transform:translateY(0)}
}
</style>
</head>

<body>

<header>Messhop 🌊</header>

<!-- HOME -->
<div id="home" class="grid"></div>

<!-- PRODUCT PAGE -->
<div id="product" class="page">

<button class="back" onclick="goHome()">⬅ Back</button>

<h2 id="title"></h2>

<img id="img">

<div class="price" id="price"></div>

<p id="desc"></p>

<h3>Sizes</h3>
<div class="sizes" id="sizes"></div>

<button class="btn">Add to cart 🛒</button>
<button class="btn">Commander</button>

<div class="relatedTitle">Produits similaires 🔥</div>
<div class="smallGrid" id="related"></div>

</div>

<script>

/* PRODUCTS DATABASE */
const products = [
{
id:1,
name:"Pochette Waterproof",
price:"99 DH",
img:"https://images.unsplash.com/photo-1512941937669-90a1b58e7e9c",
sizes:["S","M","L","XL"],
desc:"Protection ضد الماء للبحر و piscine"
},
{
id:2,
name:"Mini Fan",
price:"79 DH",
img:"https://images.unsplash.com/photo-1523275335684-37898b6baf30",
sizes:["One Size"],
desc:"Ventilateur portable قوي للصيف"
},
{
id:3,
name:"LED Lamp",
price:"120 DH",
img:"https://images.unsplash.com/photo-1507473885765-e6ed057f782c",
sizes:["Small","Medium"],
desc:"Lampe décorative للدار"
},
{
id:4,
name:"Beach Bag",
price:"89 DH",
img:"https://images.unsplash.com/photo-1512436991641-6745cdb1723f",
sizes:["S","M","L"],
desc:"Sac ديال البحر و السفر"
},
{
id:5,
name:"Phone Holder",
price:"59 DH",
img:"https://images.unsplash.com/photo-1511707171634-5f897ff02aa9",
sizes:["Universal"],
desc:"Support téléphone للسيارة"
},
{
id:6,
name:"Speaker Mini",
price:"149 DH",
img:"https://images.unsplash.com/photo-1505740420928-5e560c06d30e",
sizes:["One Size"],
desc:"Speaker قوي وصغير"
}
]

/* LOAD HOME */
function loadHome(){
document.getElementById("home").innerHTML =
products.map(p=>`
<div class="card" onclick="openProduct(${p.id})">
<img src="${p.img}">
<p>${p.name}</p>
<p><b>${p.price}</b></p>
</div>
`).join("")
}
loadHome()

/* OPEN PRODUCT */
function openProduct(id){

let p = products.find(x=>x.id===id)

document.getElementById("home").style.display="none"
document.getElementById("product").classList.add("show")

document.getElementById("title").innerText=p.name
document.getElementById("img").src=p.img
document.getElementById("price").innerText=p.price
document.getElementById("desc").innerText=p.desc

/* sizes */
document.getElementById("sizes").innerHTML =
p.sizes.map(s=>`<button onclick="selectSize(this)">${s}</button>`).join("")

/* related */
document.getElementById("related").innerHTML =
products.filter(x=>x.id!==id).map(r=>`
<div class="small" onclick="openProduct(${r.id})">
<img src="${r.img}">
</div>
`).join("")
}

/* SIZE SELECT */
function selectSize(btn){
document.querySelectorAll(".sizes button").forEach(b=>b.classList.remove("active"))
btn.classList.add("active")
}

/* GO HOME */
function goHome(){
document.getElementById("product").classList.remove("show")
document.getElementById("home").style.display="grid"
}
</script>

</body>
</html>
