</footer>

<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Messhop Payments</title>

<style>
body{margin:0;font-family:Arial;background:#f5f6f8;}

header{
background:#00a2ff;color:white;
padding:10px;text-align:center;
position:sticky;top:0;
}

.grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:4px;padding:4px;
}

.card{
background:white;border-radius:8px;padding:3px;cursor:pointer;
}

.card img{width:100%;height:80px;object-fit:cover;border-radius:6px;}
.card p{font-size:10px;margin:2px;}
.card b{font-size:11px;color:#0099ff;}

.page{display:none;padding:10px;}

.btn{
width:100%;
background:#ff6b00;
color:white;
padding:10px;
border:none;
border-radius:10px;
margin-top:6px;
cursor:pointer;
}

.cart{
position:fixed;bottom:20px;right:20px;
background:#ff6b00;color:white;
padding:12px;border-radius:50px;
cursor:pointer;
}

input,textarea,select{
width:100%;
padding:8px;
margin:5px 0;
border-radius:8px;
border:1px solid #ddd;
}

.item{
background:white;
padding:8px;
margin:5px 0;
border-radius:8px;
}

.price{font-weight:bold;color:#0099ff;}
</style>
</head>

<body>

<header>Messhop 💳🚀</header>

<div id="home" class="grid"></div>

<div id="product" class="page">

<button class="btn" onclick="goHome()">⬅ Back</button>

<h2 id="title"></h2>
<img id="img" style="width:100%;height:220px;object-fit:cover;border-radius:12px;">
<div class="price" id="price"></div>

<h3>Quantity</h3>
<input type="number" id="qty" value="1" min="1">

<h3>Payment Method</h3>
<select id="payment">
<option value="COD">Cash on Delivery (COD)</option>
<option value="CARD">Credit Card (Stripe)</option>
</select>

<button class="btn" onclick="addToCart()">🛒 Add to Cart</button>

</div>

<!-- CART -->
<div id="cartPage" class="page">

<h2>Your Cart 🛒</h2>
<div id="cartItems"></div>

<h3 id="total"></h3>

<h3>Checkout Info</h3>

<input id="name" placeholder="Name">
<input id="phone" placeholder="Phone">
<textarea id="address" placeholder="Address"></textarea>

<h3>Payment</h3>
<select id="payMethod">
<option value="COD">Cash on Delivery</option>
<option value="CARD">Card (Stripe)</option>
</select>

<button class="btn" style="background:#25D366" onclick="sendWhatsApp()">
📩 Confirm Order (WhatsApp)
</button>

<button class="btn" onclick="closeCart()">⬅ Back</button>

</div>

<div class="cart" onclick="openCart()">
🛒 <span id="count">0</span>
</div>

<script>

const products=[
{id:1,name:"Waterproof Case",price:99,img:"https://images.unsplash.com/photo-1512941937669-90a1b58e7e9c"},
{id:2,name:"Mini Fan",price:79,img:"https://images.unsplash.com/photo-1523275335684-90a1b58e7e9c"},
{id:3,name:"LED Lamp",price:120,img:"https://images.unsplash.com/photo-1507473885765-e6ed057f782c"}
]

let cart=[]
let current=null

function load(){
document.getElementById("home").innerHTML=
products.map(p=>`
<div class="card" onclick="openP(${p.id})">
<img src="${p.img}">
<p>${p.name}</p>
<b>${p.price} DH</b>
</div>
`).join("")
}
load()

function openP(id){
current=products.find(x=>x.id===id)

document.getElementById("home").style.display="none"
document.getElementById("product").style.display="block"

document.getElementById("title").innerText=current.name
document.getElementById("img").src=current.img
document.getElementById("price").innerText=current.price+" DH"
}

function addToCart(){
let qty=parseInt(document.getElementById("qty").value)
let pay=document.getElementById("payment").value

cart.push({
name:current.name,
price:current.price,
qty:qty,
payment:pay
})

document.getElementById("count").innerText=cart.length
alert("Added 🛒")
}

function openCart(){
document.getElementById("product").style.display="none"
document.getElementById("home").style.display="none"
document.getElementById("cartPage").style.display="block"

let total=0

document.getElementById("cartItems").innerHTML=
cart.map(c=>{
total+=c.price*c.qty
return `<div class="item">
<b>${c.name}</b><br>
${c.price} DH x ${c.qty}<br>
Payment: ${c.payment}
</div>`
}).join("")

document.getElementById("total").innerText="Total: "+total+" DH"
}

/* WHATSAPP ORDER */
function sendWhatsApp(){

let name=document.getElementById("name").value
let phone=document.getElementById("phone").value
let address=document.getElementById("address").value
let pay=document.getElementById("payMethod").value

if(!name||!phone||!address){
alert("Fill all fields")
return
}

let items=""
let total=0

cart.forEach(c=>{
items+=`- ${c.name} x${c.qty} = ${c.price*c.qty} DH | Payment: ${c.payment}\n`
total+=c.price*c.qty
})

/* PAYMENT LOGIC */
let paymentText=""
if(pay==="COD"){
paymentText="Cash on Delivery"
}else{
paymentText="Card Payment (Stripe - pending confirmation)"
}

let msg=
`🛒 NEW ORDER

${items}

TOTAL: ${total} DH

💳 Payment: ${paymentText}

👤 ${name}
📞 ${phone}
📍 ${address}

🚚 Delivery: 20 DH`

// WhatsApp send (hidden number)
window.open("https://wa.me/212695979661?text="+encodeURIComponent(msg))
}

function goHome(){
document.getElementById("product").style.display="none"
document.getElementById("home").style.display="grid"
}

function closeCart(){
document.getElementById("cartPage").style.display="none"
document.getElementById("home").style.display="grid"
}

</script>

</body>
</html>
