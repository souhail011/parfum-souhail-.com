</footer>

<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Messhop</title>

<style>
body{margin:0;font-family:Arial;background:#f4f6f9}

/* HEADER */
header{
background:#00a2ff;
color:white;
padding:12px;
text-align:center;
font-size:20px;
font-weight:bold;
}

/* GRID HOME */
.grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:10px;
padding:10px;
}

.card{
background:white;
border-radius:12px;
overflow:hidden;
cursor:pointer;
}

.card img{
width:100%;
height:130px;
object-fit:cover;
}

.card p{margin:5px}

/* PAGES */
.page, #checkoutBox{
display:none;
padding:15px;
}

.page img{
width:100%;
border-radius:12px;
}

/* BUTTON */
.btn{
display:block;
background:#ff6b00;
color:white;
text-align:center;
padding:12px;
border-radius:10px;
text-decoration:none;
margin-top:10px;
border:none;
cursor:pointer;
}

/* BACK */
.back{
background:black;
color:white;
padding:8px 12px;
border:none;
border-radius:8px;
margin-bottom:10px;
cursor:pointer;
}

/* CART */
.cart{
position:fixed;
bottom:20px;
right:20px;
background:#ff6b00;
color:white;
padding:12px;
border-radius:50px;
font-weight:bold;
cursor:pointer;
}

/* CHECKOUT */
input{
width:100%;
padding:10px;
margin:5px 0;
border:1px solid #ccc;
border-radius:8px;
}

/* ANIMATION */
.show{
display:block;
animation:fade 0.25s ease;
}

@keyframes fade{
from{opacity:0;transform:translateY(10px)}
to{opacity:1;transform:translateY(0)}
}
</style>
</head>

<body>

<header>Messhop 🌊</header>

<!-- HOME -->
<div id="home" class="grid">

<div class="card" onclick="openPage('p1')">
<img src="https://images.unsplash.com/photo-1512941937669-90a1b58e7e9c">
<p>Pochette Waterproof</p>
</div>

<div class="card" onclick="openPage('p2')">
<img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30">
<p>Mini Fan</p>
</div>

<div class="card" onclick="openPage('p3')">
<img src="https://images.unsplash.com/photo-1507473885765-e6ed057f782c">
<p>LED Lamp</p>
</div>

</div>

<!-- PRODUCT 1 -->
<div id="p1" class="page">

<button class="back" onclick="goHome()">⬅ Back</button>

<h2>Pochette Waterproof 📱</h2>

<img src="https://images.unsplash.com/photo-1511707171634-5f897ff02aa9">

<p>Protection ضد الماء للبحر و piscine</p>

<h3>99 DH</h3>

<button class="btn" onclick="addCart()">Add to cart 🛒</button>
<button class="btn" onclick="openCheckout()">Commander</button>

<h3>Produits similaires 🔥</h3>

<div class="grid">
<div class="card" onclick="openPage('p2')">
<img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30">
</div>
<div class="card" onclick="openPage('p3')">
<img src="https://images.unsplash.com/photo-1507473885765-e6ed057f782c">
</div>
</div>

</div>

<!-- PRODUCT 2 -->
<div id="p2" class="page">

<button class="back" onclick="goHome()">⬅ Back</button>

<h2>Mini Fan ❄️</h2>

<img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30">

<p>Ventilateur portable</p>

<h3>79 DH</h3>

<button class="btn" onclick="addCart()">Add to cart 🛒</button>
<button class="btn" onclick="openCheckout()">Commander</button>

</div>

<!-- PRODUCT 3 -->
<div id="p3" class="page">

<button class="back" onclick="goHome()">⬅ Back</button>

<h2>LED Lamp 💡</h2>

<img src="https://images.unsplash.com/photo-1507473885765-e6ed057f782c">

<p>Lumière décorative</p>

<h3>120 DH</h3>

<button class="btn" onclick="addCart()">Add to cart 🛒</button>
<button class="btn" onclick="openCheckout()">Commander</button>

</div>

<!-- CHECKOUT -->
<div id="checkoutBox">

<button class="back" onclick="closeCheckout()">⬅ Back</button>

<h2>Commande COD 🚚</h2>

<input id="name" placeholder="Nom">
<input id="phone" placeholder="Téléphone">
<input id="city" placeholder="Ville">
<input id="address" placeholder="Adresse">

<button class="btn" onclick="confirmOrder()">
Confirmer la commande
</button>

<p id="msg"></p>

</div>

<!-- CART -->
<div class="cart" onclick="alert('Cart: '+cart)">
🛒 <span id="cartCount">0</span>
</div>

<script>

let cart = 0;

function openPage(id){
document.getElementById("home").style.display="none";
document.querySelectorAll(".page").forEach(p=>p.classList.remove("show"));
document.getElementById("checkoutBox").style.display="none";
document.getElementById(id).classList.add("show");
}

function goHome(){
document.querySelectorAll(".page").forEach(p=>p.classList.remove("show"));
document.getElementById("checkoutBox").style.display="none";
document.getElementById("home").style.display="grid";
}

function addCart(){
cart++;
document.getElementById("cartCount").innerText=cart;
}

function openCheckout(){
document.getElementById("home").style.display="none";
document.querySelectorAll(".page").forEach(p=>p.classList.remove("show"));
document.getElementById("checkoutBox").style.display="block";
}

function closeCheckout(){
document.getElementById("checkoutBox").style.display="none";
document.getElementById("home").style.display="grid";
}

function confirmOrder(){

let n=document.getElementById("name").value;
let p=document.getElementById("phone").value;
let c=document.getElementById("city").value;
let a=document.getElementById("address").value;

if(!n||!p||!c||!a){
document.getElementById("msg").innerText="❌ Fill all fields";
return;
}

document.getElementById("msg").innerText="✅ Order confirmed!";
cart=0;
document.getElementById("cartCount").innerText=0;
}

</script>

</body>
</html>
