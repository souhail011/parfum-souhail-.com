<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Messhop Ultimate</title>

<style>
body{margin:0;font-family:Arial;background:#f5f6f8;}

header{
background:#00a2ff;color:white;
padding:10px;text-align:center;
font-weight:bold;
position:sticky;top:0;
z-index:10;
}

.search{
padding:6px;background:white;
}
.search input{
width:100%;padding:8px;border-radius:8px;border:1px solid #ddd;
}

.grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:4px;padding:4px;
}

.card{
background:white;border-radius:8px;
padding:3px;cursor:pointer;
}

.card img{
width:100%;height:80px;object-fit:cover;border-radius:6px;
}

.card p{font-size:10px;margin:2px;}
.card b{font-size:11px;color:#0099ff;}

.page{display:none;padding:10px;}

.btn{
width:100%;
padding:10px;
background:#ff6b00;
color:white;
border:none;
border-radius:10px;
margin-top:6px;
cursor:pointer;
}

.cart{
position:fixed;
bottom:20px;
right:20px;
background:#ff6b00;
color:white;
padding:12px;
border-radius:50px;
cursor:pointer;
}

.item{
background:white;
padding:8px;
margin:5px 0;
border-radius:8px;
}

input,textarea,select{
width:100%;
padding:8px;
margin:5px 0;
border-radius:8px;
border:1px solid #ddd;
}

.price{color:#0099ff;font-weight:bold;}
.small{height:70px;border-radius:6px;object-fit:cover;width:100%;}
</style>
</head>

<body>

<header>Messhop 🚀</header>

<div class="search">
<input id="search" placeholder="Search..." oninput="filter()">
</div>

<div id="home" class="grid"></div>

<!-- PRODUCT -->
<div id="product" class="page">

<button class="btn" onclick="goHome()">⬅ Back</button>

<h2 id="title"></h2>
<img id="img" style="width:100%;height:220px;object-fit:cover;border-radius:12px;">
<div class="price" id="price"></div>

<h3>Qty</h3>
<input type="number" id="qty" value="1" min="1">

<h3>Payment</h3>
<select id="payment">
<option value="COD">Cash on Delivery</option>
<option value="CARD">Card</option>
</select>

<button class="btn" onclick="addToCart()">🛒 Add to Cart</button>

</div>

<!-- CART -->
<div id="cartPage" class="page">

<h2>Your Cart 🛒</h2>
<div id="cartItems"></div>

<h3 id="total"></h3>

<h3>Checkout</h3>

<input id="name" placeholder="Name">
<input id="phone" placeholder="Phone">
<textarea id="address" placeholder="Address"></textarea>

<button class="btn" style="background:#25D366" onclick="sendWhatsApp()">
📩 Send Order
</button>

<button class="btn" onclick="closeCart()">⬅ Back</button>

</div>

<div class="cart" onclick="openCart()">
🛒 <span id="count">0</span>
</div>

let cart=[]
let current=null

function load(){
document.getElementById("home").innerHTML=
products.map(p=>`
<div class="card" onclick="openP(${p.id})">
<img src="${p.img}">
<p>${p.name}</p>
<b>${p.price} DH</b>
</div>
`).join("")
}
load()

function openP(id){
current=products.find(x=>x.id===id)

document.getElementById("home").style.display="none"
document.getElementById("cartPage").style.display="none"
document.getElementById("product").style.display="block"

document.getElementById("title").innerText=current.name
document.getElementById("img").src=current.img
document.getElementById("price").innerText=current.price+" DH"
}

function addToCart(){
let qty=1
cart.push({name:current.name,price:current.price,qty:qty})
document.getElementById("count").innerText=cart.length
alert("Added 🛒")
}

function openCart(){
document.getElementById("home").style.display="none"
document.getElementById("product").style.display="none"
document.getElementById("cartPage").style.display="block"

let total=0

document.getElementById("cartItems").innerHTML=
cart.map(c=>{
total+=c.price*c.qty
return `<div class="item">
<b>${c.name}</b><br>
${c.price} DH x ${c.qty}
</div>`
}).join("")

document.getElementById("total").innerText="Total: "+total+" DH"
}

function sendWhatsApp(){

if(cart.length===0){
alert("Cart empty")
return
}

let name=document.getElementById("name").value
let phone=document.getElementById("phone").value
let address=document.getElementById("address").value

if(!name||!phone||!address){
alert("Fill all fields")
return
}

let items=""
let total=0

cart.forEach(c=>{
items+=`- ${c.name} x${c.qty} = ${c.price*c.qty} DH\n`
total+=c.price*c.qty
})

let msg=
`🛒 ORDER

${items}

TOTAL: ${total} DH

👤 ${name}
📞 ${phone}
📍 ${address}

🚚 Delivery: 20 DH`

window.open("https://wa.me/212695979661?text="+encodeURIComponent(msg))
}

function goHome(){
document.getElementById("product").style.display="none"
document.getElementById("cartPage").style.display="none"
document.getElementById("home").style.display="grid"
load()
}

function closeCart(){
document.getElementById("cartPage").style.display="none"
document.getElementById("home").style.display="grid"
load()
}

function filter(){
let v=document.getElementById("search").value.toLowerCase()
document.getElementById("home").innerHTML=
products.filter(p=>p.name.toLowerCase().includes(v))
.map(p=>`
<div class="card" onclick="openP(${p.id})">
<img src="${p.img}">
<p>${p.name}</p>
<b>${p.price}</b>
</div>
`).join("")
}
